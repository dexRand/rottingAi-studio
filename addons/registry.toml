label = "Docker containers and Compose"
magika = ["dockerfile"]
keywords = ["docker", "dockerfile", "compose", "immagine docker", "podman"]

[addons.http]
category = "shared"
type = "instructions"
file = "addons/shared/http.md"
label = "HTTP and REST API calls"
magika = []
keywords = ["http", "https", "api", "endpoint", "curl", "status code", "bearer",
            "rest", "webhook"]

[addons.regex]
category = "shared"
type = "instructions"
file = "addons/shared/regex.md"
label = "Regular expressions"
magika = []
keywords = ["regex", "regexp", "regular expression", "lookahead", "lookbehind",
            "capture group", "backreference"]

[addons.git]
category = "shared"
type = "instructions"
file = "addons/shared/git.md"
label = "Git version control"
magika = []
keywords = ["git", "commit", "branch", "merge", "rebase", "push", "pull", "stash",
            "clone", "checkout", "cherry-pick", "bisect", "pull request"]

[addons.sql]
category = "shared"
type = "instructions"
file = "addons/shared/sql.md"
label = "SQL queries and databases"
magika = []
# no bare "sql": it matched "SQL injection" in CTF prompts (like the docker
# "container" case). Databases and query words cover the real SQL requests.
keywords = ["query", "join", "group by", "insert into", "postgres",
            "postgresql", "mysql", "sqlite", "psql", "database"]

[addons.summarize]
category = "shared"
type = "instructions"
file = "addons/shared/summarize.md"
label = "Summarization"
magika = []
# explicit English forms: \b matching means "summar" alone only hits the bare
# word, not "summarize" / "summary" / "summarise".
keywords = ["riassumi", "riassunto", "riassumere", "summar", "summarize", "summarise", "summary",
            "sintesi", "sintetizza", "sintetizzare", "tldr", "tl;dr", "punti chiave", "bullet"]

[addons.translate]
category = "shared"
type = "instructions"
file = "addons/shared/translate.md"
label = "Translation"
magika = []
keywords = ["traduci", "traduzione", "tradurre", "translate", "translation", "in inglese", "in italiano", "into english", "in english"]

[addons.humanize]
category = "shared"
type = "instructions"
file = "addons/shared/humanize.md"
label = "Humanize text"
magika = []
keywords = ["humanize", "humanise", "umanizza", "umanizzare", "più umano", "più naturale", "meno robotico"]

# --- skill catalog ----------------------------------------------------------
# OpenCode-only skills grouped by category. They are too large to inject
# (2.5k–10k tokens each on a 16K context), so the router does NOT append them:
# OpenCode loads them on demand through its own skill tool. Kept here so the
# skill set is organized by category in one place.
[catalog]
coding = ["api-and-interface-design", "browser-testing-with-devtools", "ci-cd-and-automation",
          "code-review-and-quality", "code-simplification", "constraint-driven-development",
          "context-engineering", "debugging-and-error-recovery", "deprecation-and-migration",
          "documentation-and-adrs", "doubt-driven-development", "frontend-ui-engineering",
          "git-workflow-and-versioning", "idea-refine", "incremental-implementation", "interview-me",
          "observability-and-instrumentation", "performance-optimization",
          "planning-and-task-breakdown", "security-and-hardening", "shipping-and-launch",
          "source-driven-development", "spec-driven-development", "test-driven-development"]
sysadmin = ["local-ai"]
ctf = ["ctf-toolbox", "ctf-web", "ctf-crypto", "ctf-pwn", "ctf-reverse", "ctf-forensics",
       "ctf-osint", "ctf-misc", "ctf-malware", "ctf-ai-ml", "ctf-similar-search", "ctf-writeup"]
meta = ["find-skills", "using-agent-skills"]
