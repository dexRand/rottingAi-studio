# --- ctf --------------------------------------------------------------------

[addons.ctf-triage]
category = "ctf"
type = "instructions"
file = "addons/ctf/triage.md"
label = "CTF triage"
magika = ["elf", "pebin", "wasm"]  # binary files route here even without a textual hint
keywords = ["ctf", "capture the flag", "flag", "exploit", "payload", "shellcode",
            "buffer overflow", "pwn", "reverse engineering", "stego", "forensics",
            "malware", "md5", "jwt", "sql injection", "crypto", "cipher", "rsa", "osint",
            "esfiltrato", "exfiltration"]

# --- shared (any category) ----------------------------------------------------

[addons.docker]
category = "shared"
