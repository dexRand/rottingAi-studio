# ============================================================================
# rottingAi-studio — optional services (all OFF by default)
#
# The inference engine (llama.cpp) and the router run NATIVE on the host.
# This compose file only contains OPTIONAL auxiliary services, each behind a
# profile. `docker compose up` (no args) starts nothing.
#
#   docker compose --profile gui up -d     # Open WebUI (full GUI)
# ============================================================================

services:
  # --- GUI: Open WebUI, pointed at the native llama-server ----------------
  webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["gui"]
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    environment:
      # Point Open WebUI at the router (OpenAI API, adds the add-ons).
      # The router must listen beyond localhost for the container to reach it:
      # set ROUTER_HOST=0.0.0.0 (+ LLAMA_API_KEY) in .env.
      OPENAI_API_BASE_URL: "http://host.docker.internal:${ROUTER_PORT:-8080}/v1"
      OPENAI_API_KEY: "sk-no-key-required"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webui-data:/app/backend/data
    restart: "no"

  # --- RAG / web-search: NOT implemented yet (future, optional) ----------
  # rag:
  #   build: ./services/rag
  #   profiles: ["rag"]
  # web-search:
  #   build: ./services/web-search
  #   profiles: ["web-search"]

volumes:
  webui-data:
