# ============================================================================
# Role presets for llama-server.
# Each role maps to a GGUF filename (inside $MODELS_DIR), a server --alias and
# a context size. Aliases MUST match the OpenCode model IDs in
# config/opencode/opencode.jsonc.
#
# Files verified against Hugging Face on 2026-11-10 (see docs/models.md).
# ============================================================================

# --- coding ---------------------------------------------------------------
CODER_MODEL="qwen2.5-coder-7b-instruct-q4_k_m.gguf"
CODER_ALIAS="qwen2.5-coder-7b"
CODER_CTX=16384

# --- general purpose / Italian -------------------------------------------
GENERAL_MODEL="Qwen3-8B-Q4_K_M.gguf"
GENERAL_ALIAS="qwen3-8b"
GENERAL_CTX=16384
GENERAL_REASONING="auto"

# --- fast (superfast: Qwen3.5-4B, newer gen + fixed tool-calling template) --
FAST_MODEL="Qwen3.5-4B-Q4_K_M.gguf"
FAST_ALIAS="qwen3.5-4b"
FAST_CTX=16384
FAST_REASONING="off"

# --- ctf (security fine-tune: WhiteRabbitNeo-2.5 on Qwen2.5-Coder-7B) ----
CTF_MODEL="WhiteRabbitNeo-2.5-Qwen-2.5-Coder-7B-Q4_K_M.gguf"
CTF_ALIAS="whiterabbitneo-7b"
CTF_CTX=16384

# --- sysadmin (fast default: 7B) -----------------------------------------
# Note: the 12B (Gemma 3) was too slow on this CPU (~2.3 t/s measured) — it is
# kept as the optional "sysadmin-heavy" role below.
SYSADMIN_MODEL="Qwen2.5-7B-Instruct-Q5_K_M.gguf"
SYSADMIN_ALIAS="qwen2.5-7b"
SYSADMIN_CTX=16384

# --- sysadmin-heavy (optional: depth / 128K context, ~2.3 t/s) ----------
SYSADMIN_HEAVY_MODEL="google_gemma-3-12b-it-Q4_K_M.gguf"
SYSADMIN_HEAVY_ALIAS="gemma-3-12b"
SYSADMIN_HEAVY_CTX=32768
