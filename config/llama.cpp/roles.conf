# ============================================================================
# Model presets for llama-server — ONE base model, always loaded.
#
# The router (router/, config/router.toml) adds add-ons to the context instead
# of switching models: a model switch throws away the KV cache and forces the
# whole conversation to be re-processed on CPU.
#
#   base  -> the default, always-on model (./ai start)
#   lite  -> same family, smaller: pick it INSTEAD of base on weaker machines
#   ctf   -> rare exception: security fine-tune, loaded only on explicit request
#
# Only one of them runs at a time. Aliases MUST match the OpenCode model IDs in
# config/opencode/opencode.jsonc.
# Files verified against Hugging Face on 2026-11-20 (see docs/models.md).
# ============================================================================

# Role used by `./ai start` / `./ai chat` when none is given.
# `base` (9B) needs ~8.6 GB RSS and does not fit in 8 GB of RAM: the responsive
# default is `lite` (4B, ~4.7 GB). `base` remains available with `./ai start base`.
DEFAULT_ROLE="lite"

# --- base: Qwen3.5-9B (main candidate, to confirm with ./ai benchmark) -----
BASE_MODEL="Qwen3.5-9B-Q4_K_M.gguf"
BASE_ALIAS="qwen3.5-9b"
BASE_CTX=16384
BASE_REASONING="off"       # thinking off by default (CLAUDE.md); the agent turns it on per request
# Template that keeps old reasoning in the history: the stock Qwen3.5 template drops
# it at every new user message, changing the prefix and throwing away the KV cache
# (measured: 4179 tokens re-processed for a one-line follow-up). Path from repo root.
BASE_CHAT_TEMPLATE="config/llama.cpp/qwen3.5-kv-stable.jinja"

# --- lite: Qwen3.5-4B (faster alternative, ~3 GB) --------------------------
LITE_MODEL="Qwen3.5-4B-Q4_K_M.gguf"
LITE_ALIAS="qwen3.5-4b"
LITE_CTX=16384
LITE_REASONING="off"
# Same family: extract its template (curl :8081/props) and diff it before reusing ours.
LITE_CHAT_TEMPLATE=""

# --- ctf: WhiteRabbitNeo-2.5 on Qwen2.5-Coder-7B (exception, rare use) -----
CTF_MODEL="WhiteRabbitNeo-2.5-Qwen-2.5-Coder-7B-Q4_K_M.gguf"
CTF_ALIAS="whiterabbitneo-7b"
CTF_CTX=16384
# The GGUF ships a plain ChatML template with no tool support: llama-server
# simply cannot offer `tools` to the model, so tool calling (the `ai` agent,
# StegSuite MCP) silently does nothing and the model invents the output.
# Qwen2.5's own template from llama.cpp adds <tool_call> support; measured on
# 2026-11-21: two prompts, two valid tool_calls, plus a full tool-result round
# trip. Copied into the repo so it does not depend on the git-ignored build.
CTF_CHAT_TEMPLATE="config/llama.cpp/qwen2.5-tools.jinja"
